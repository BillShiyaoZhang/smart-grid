<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>潮汐电网 · 界面设计评审</title>
  <style>
    :root { color-scheme:dark; --bg:#081b24; --panel:#102a35; --line:#28434d; --text:#f2eddb; --muted:#9eb3b8; --accent:#83dfc3; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-width:320px; min-height:100%; }
    body { height:100dvh; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:21px 28px 16px; }
    .identity { display:flex; align-items:center; gap:15px; min-width:0; }
    .symbol { color:var(--accent); font-size:29px; line-height:1; }
    h1 { font-size:19px; line-height:1.3; margin:0; font-weight:600; letter-spacing:.035em; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:11px; letter-spacing:.14em; }
    .context { color:var(--muted); font-size:12px; white-space:nowrap; }
    .context span { color:#c5d0cc; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 28px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    nav { display:flex; gap:4px; overflow-x:auto; scrollbar-width:thin; padding:9px 0; }
    nav button { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:10px 13px; border:1px solid transparent; border-radius:6px; background:transparent; color:var(--muted); font-size:13px; white-space:nowrap; transition:color .15s,background .15s; }
    nav button:hover { color:var(--text); background:var(--panel); }
    nav button[aria-current="true"] { color:var(--accent); background:#173d42; border-color:#3a6864; }
    .number { opacity:.62; font-size:10px; font-variant-numeric:tabular-nums; }
    .view { display:flex; align-items:center; gap:7px; flex-shrink:0; }
    .control { padding:8px 11px; border:1px solid var(--line); border-radius:5px; background:transparent; color:var(--muted); font-size:12px; white-space:nowrap; }
    .control:hover { border-color:#658582; color:var(--text); }
    .control[aria-pressed="true"] { color:var(--accent); border-color:#3a6864; background:#173d42; }
    main { min-height:0; padding:20px 28px 12px; }
    .canvas { width:100%; height:100%; min-height:180px; overflow:auto; display:grid; place-items:center; background:#06141c; border:1px solid #203d47; border-radius:5px; box-shadow:0 14px 45px #020b1140; }
    .canvas img { display:block; width:100%; height:100%; min-width:0; min-height:0; object-fit:contain; }
    .canvas.native { display:block; }
    .canvas.native img { width:auto; height:auto; max-width:none; max-height:none; object-fit:initial; }
    footer { display:flex; align-items:center; gap:16px; justify-content:space-between; padding:0 28px 18px; }
    .caption { display:flex; align-items:baseline; flex:1; gap:14px; min-width:0; font-size:12px; }
    .counter { color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
    #description { color:#b4c5c5; margin:0; line-height:1.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .footer-actions { display:flex; align-items:center; gap:14px; flex-shrink:0; }
    .key-hint { font-size:11px; color:#738e98; white-space:nowrap; }
    #original { color:var(--accent); font-size:12px; text-decoration:none; white-space:nowrap; }
    #original:hover { text-decoration:underline; }
    @media(max-width:1050px) { .toolbar { gap:8px; } nav button { padding:10px 9px; gap:5px; } .context { font-size:11px; } }
    @media(max-width:820px) { body { height:auto; min-height:100dvh; grid-template-rows:auto auto minmax(280px,1fr) auto; } header { align-items:flex-start; padding:18px 16px 14px; gap:12px; } h1 { font-size:16px; } .symbol { font-size:25px; } .identity { gap:10px; } .context { white-space:normal; max-width:110px; text-align:right; line-height:1.7; font-size:10px; } .context span { display:block; } .subtitle { font-size:9px; } .toolbar { margin:0 16px; display:block; } nav { width:100%; } .view { justify-content:flex-end; padding:0 0 9px; } .control { padding:6px 10px; } main { padding:14px 16px; height:calc(100dvh - 260px); min-height:280px; } footer { padding:0 16px 18px; align-items:flex-start; gap:10px; } .caption { gap:8px; font-size:11px; } .key-hint { display:none; } .footer-actions { padding-top:2px; } #original { font-size:11px; } }
    @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <header>
    <div class="identity"><div class="symbol" aria-hidden="true">ϟ</div><div><h1>潮汐电网 · 界面设计评审</h1><p class="subtitle">TIDAL GRID / INTERFACE STUDY</p></div></div>
    <aside class="context"><span>概念设计 / 示例数据</span> / 尚未接入仿真</aside>
  </header>
  <div class="toolbar">
    <nav aria-label="设计页面">
      <button type="button" data-screen="0" aria-current="true"><span class="number">01</span>运营总览</button>
      <button type="button" data-screen="1" aria-current="false"><span class="number">02</span>设施调度</button>
      <button type="button" data-screen="2" aria-current="false"><span class="number">03</span>经营中心</button>
      <button type="button" data-screen="3" aria-current="false"><span class="number">04</span>故障处置</button>
      <button type="button" data-screen="4" aria-current="false"><span class="number">05</span>通信安全</button>
      <button type="button" data-screen="5" aria-current="false"><span class="number">06</span>科技研究</button>
      <button type="button" data-screen="6" aria-current="false"><span class="number">07</span>区域发展</button>
    </nav>
    <div class="view" role="group" aria-label="图片显示比例">
      <button class="control" type="button" id="fit" aria-pressed="true">完整显示</button>
      <button class="control" type="button" id="native" aria-pressed="false">100% 查看</button>
    </div>
  </div>
  <main><div class="canvas" id="canvas" role="region" tabindex="0" aria-label="高保真界面图"><img id="screen" src="01-overview.png" alt="运营总览高保真概念图" decoding="async"></div></main>
  <footer>
    <div class="caption" aria-live="polite"><span class="counter" id="counter">01 / 07</span><p id="description">供电结果优先，地图承载问题，情境操作直接接续下一步。</p></div>
    <div class="footer-actions"><span class="key-hint">← → 切换页面</span><a id="original" href="01-overview.png" target="_blank" rel="noopener">查看原图 ↗</a></div>
  </footer>
  <script>
    'use strict';
    const screens = [
      { file:'01-overview.png', title:'运营总览', description:'供电结果优先，地图承载问题，情境操作直接接续下一步。' },
      { file:'02-facility.png', title:'设施调度', description:'容量、电量与实际出力分层，草案、生效值和执行进度分别呈现。' },
      { file:'03-economy.png', title:'经营中心', description:'先读经营结果与成本，再选择交易方案；参考报价辅助判断。' },
      { file:'04-incidents.png', title:'故障处置', description:'按证据组织问题，连接现场队安排、处置进度与真实回执。' },
      { file:'05-digital.png', title:'通信安全', description:'拓扑与控制条件并排，突出当前阻塞条件和适用操作。' },
      { file:'06-research.png', title:'科技研究', description:'解锁收益、前置关系、费用和时间同屏，研究选择一眼可比。' },
      { file:'07-region.png', title:'区域发展', description:'区域地图主导，城市按规划、建设接入、开通服务逐步推进。' }
    ];
    const image = document.getElementById('screen');
    const canvas = document.getElementById('canvas');
    const buttons = Array.from(document.querySelectorAll('[data-screen]'));
    let current = 0;
    function show(index, updateHash = true) {
      current = (index + screens.length) % screens.length;
      const screen = screens[current];
      image.src = screen.file;
      image.alt = screen.title + '高保真概念图';
      document.getElementById('description').textContent = screen.description;
      document.getElementById('description').title = screen.description;
      document.getElementById('counter').textContent = String(current + 1).padStart(2, '0') + ' / 07';
      document.getElementById('original').href = screen.file;
      buttons.forEach((button, i) => button.setAttribute('aria-current', String(i === current)));
      canvas.scrollTo({ top:0, left:0 });
      if (updateHash) history.replaceState(null, '', '#' + String(current + 1));
    }
    function setNative(native) {
      canvas.classList.toggle('native', native);
      document.getElementById('fit').setAttribute('aria-pressed', String(!native));
      document.getElementById('native').setAttribute('aria-pressed', String(native));
      canvas.scrollTo({ top:0, left:0 });
    }
    buttons.forEach(button => button.addEventListener('click', () => show(Number(button.dataset.screen))));
    document.getElementById('fit').addEventListener('click', () => setNative(false));
    document.getElementById('native').addEventListener('click', () => setNative(true));
    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
        event.preventDefault();
        const navigationFocused = buttons.includes(document.activeElement);
        show(current + (event.key === 'ArrowRight' ? 1 : -1));
        if (navigationFocused) buttons[current].focus({ preventScroll:true });
        buttons[current].scrollIntoView({ block:'nearest', inline:'nearest' });
      }
    });
    function readHash() {
      const index = Number(location.hash.slice(1));
      show(Number.isInteger(index) && index >= 1 && index <= screens.length ? index - 1 : 0, false);
    }
    window.addEventListener('hashchange', readHash);
    readHash();
  </script>
</body>
</html>
